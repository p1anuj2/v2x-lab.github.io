<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People | Connected Automated System V2X Lab @ IITD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f9fe;--ink:#0c2b45;--muted:#4b6a84;--primary:#0ea5e9;--deep:#0369a1;--soft:#e0f2fe;--line:#cfe5f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a:focus-visible,button:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
header{background:#fff;border-bottom:1px solid var(--line);padding:.8rem 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;position:sticky;top:0;z-index:5}
.brand-logo{height:44px;display:block}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:600;padding:.4rem .9rem;border-radius:8px}
nav a:hover,nav a.active{background:var(--soft);color:var(--deep)}
.hero{padding:3rem 6% 1.5rem;background:linear-gradient(180deg,#dff1fd,var(--bg))}
.hero h1{font:700 clamp(2rem,4vw,3rem)/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em}
.hero p{color:var(--muted);margin-top:.7rem;max-width:700px}
.wrap{padding:1.5rem 6% 3rem}
.grp{margin-bottom:2.2rem}
.grp h2{font:700 1.5rem 'Space Grotesk',sans-serif;margin-bottom:1rem}
.list{display:grid;gap:1rem;max-width:880px}
.row{display:flex;gap:1.3rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.3rem;transition:border-color .2s,box-shadow .2s}
.row:hover{border-color:var(--primary);box-shadow:0 10px 28px rgba(3,105,161,.1)}
.ph{position:relative;flex:none;width:96px;height:96px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#bae6fd,#7dd3fc);display:grid;place-items:center}
.ph::before{content:attr(data-i);font:700 1.7rem 'Space Grotesk',sans-serif;color:var(--deep)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bd h3{font:700 1.2rem 'Space Grotesk',sans-serif}
.bd h3 a{color:inherit;text-decoration:none}.bd h3 a:hover{color:var(--deep)}
.meta{font-size:.85rem;color:var(--deep);font-weight:600}
.area{font-size:.92rem;color:var(--muted);margin-top:.15rem}
.area.todo{font-style:italic;opacity:.8}
.ics{display:flex;gap:.6rem;margin-top:.55rem;align-items:center}
.ic{width:28px;height:28px;display:inline-flex;color:var(--deep)}
.ic svg{width:100%;height:100%}
a.ic:hover{color:var(--primary)}
.ic.off{color:#a9c4d8;cursor:not-allowed}
.more{font-size:.85rem;font-weight:600;color:var(--deep);text-decoration:none;margin-left:.4rem}
footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:#fff}
@media(max-width:560px){.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>

<nav><a href="index.html">Home</a><a href="index.html#research">Research</a><a href="index.html#projects">Projects</a><a href="index.html#publications">Publications</a><a href="members.html" class="active">Members</a><a href="portfolio.html">PI Portfolio</a></nav>
</header>

<section class="hero">
<h1>People</h1>
<p>Faculty, PhD scholars and MSR students of the Connected Automated System V2X Lab @ IITD.</p>
</section>

<main class="wrap" id="team"></main>

<footer>Connected Automated System V2X Lab · Room IIA-307C, Bharti School / Block III Room 30, CART, IIT Delhi · tgokulnath@iitd.ac.in</footer>

<script>
/* EDIT HERE. n=name, r=role, j=joined, a=research area, p=photo file name in photos/ (jpg), l=LinkedIn URL, s=Google Scholar URL, h=page to open.
   Leave l or s empty ('') to show a greyed placeholder icon until the link is added. */
const TEAM=[
['Faculty',[
{n:'Dr. Gokulnath Thandavarayan',r:'Assistant Professor, CART · Lab PI',a:'V2X communications, cooperative perception and connected automated vehicles',p:'gokulnath',l:'https://www.linkedin.com/in/gokulnath-thandavarayan/',s:'https://scholar.google.com/citations?user=rs4O_oQAAAAJ&hl=en',h:'portfolio.html'}]],
['PhD students',[
{n:'Anuj Attri',j:'Joined August 2026',a:'Multimodal AI and Vision-Language Models for Automated Driving and Connected Vehicles',p:'anuj-attri',l:'',s:'https://scholar.google.com/citations?user=xibR16cAAAAJ&hl=en'},
{n:'Bharta Dwivedi',j:'Joined August 2026',a:'',p:'bharta-dwivedi',l:'',s:'https://scholar.google.com/citations?user=4RLIyMoAAAAJ&hl=en'},
{n:'Saket Lohali',j:'',a:'',p:'saket-lohali',l:'',s:''}]],
['MSR students',[
{n:'Sonu Yadav',a:'',p:'sonu-yadav',l:'',s:''},
{n:'Krish Ramle',a:'',p:'krish-ramle',l:'',s:''},
{n:'Anubhav Verma',a:'',p:'anubhav-verma',l:'',s:''}]]
];
const IC={
l:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="4" fill="currentColor"/><path fill="#fff" d="M6.9 9.6h2.4V18H6.9zM8.1 6a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8zM11 9.6h2.3v1.2c.4-.7 1.3-1.4 2.6-1.4 2.600 0 3.100 1.700 3.100 3.900V18h-2.400v-4.200c0-1 0-2.200-1.400-2.200s-1.600 1-1.600 2.100V18H11z"/></svg>',
s:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 1 9l11 6 9-4.900V17h2V9L12 3zm-6 9.200V16c0 1.700 2.700 3 6 3s6-1.300 6-3v-3.800L12 15.500 6 12.200z"/></svg>'};
const NM={l:'LinkedIn',s:'Google Scholar'};
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const icon=(m,k)=>m[k]?'<a class="ic" href="'+m[k]+'" target="_blank" rel="noopener" aria-label="'+esc(m.n)+' on '+NM[k]+'" title="'+NM[k]+'">'+IC[k]+'</a>':'<span class="ic off" role="img" aria-label="'+NM[k]+' link coming soon" title="'+NM[k]+' link coming soon">'+IC[k]+'</span>';
document.getElementById('team').innerHTML=TEAM.map(([g,ms])=>'<section class="grp"><h2>'+g+'</h2><div class="list">'+ms.map(m=>{
const ini=m.n.replace(/^Dr\.\s*/,'').split(' ').map(w=>w[0]).slice(0,2).join('');
const name=m.h?'<a href="'+m.h+'">'+esc(m.n)+'</a>':esc(m.n);
const meta=[m.r,m.j].filter(Boolean).join(' · ');
return '<article class="row"><div class="ph" data-i="'+ini+'"><img src="photos/'+m.p+'.jpg" alt="'+esc(m.n)+'" onerror="this.remove()"></div><div class="bd"><h3>'+name+'</h3>'+(meta?'<div class="meta">'+esc(meta)+'</div>':'')+'<p class="area'+(m.a?'':' todo')+'">'+(m.a?esc(m.a):'Research area: to be added')+'</p><div class="ics">'+icon(m,'l')+icon(m,'s')+(m.h?'<a class="more" href="'+m.h+'">View portfolio →</a>':'')+'</div></div></article>'}).join('')+'</div></section>').join('');
</script>
</body>
</html>
